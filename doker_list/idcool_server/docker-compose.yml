version: '3.9'

services:
  idcool-backend:
    build:
      context: ./idcs/idc_server
      dockerfile: Dockerfile
    environment:
      - REDIS_HOST=idcool-redis
      - REDIS_PORT=6379
      - DB_HOST=idcool-database-v01
      - DB_PORT=5432
      - DB_USER=dev
      - DB_PASSWORD=devkey1
      - DB_NAME=idcool_database_v01
    networks:
      - idcool-net
    restart: unless-stopped

networks:
  idcool-net:
    external: true
    name: idcool-network