services:
  idcool-backend:
    container_name: idcool-backend
    build:
      context: ../../idcs/idc_server        # 깃 클론된 idc_server 루트
      dockerfile: ../../doker_list/idcool_server/Dockerfile
    environment:
      - REDIS_HOST=idcool-redis
      - REDIS_PORT=6379
      - DB_HOST=idcool-database-v01
      - DB_PORT=5432
      - DB_USER=dev
      - DB_PASSWORD=devkey1
      - DB_NAME=idcool_database_v01
    networks:
      - idcool-net
    restart: unless-stopped

networks:
  idcool-net:
    external: true
    name: idcool-network