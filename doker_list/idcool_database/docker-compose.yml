version: '3.9'

services:
  idcool-database-v01:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: idcool-database-v01
    environment:
      POSTGRES_PASSWORD: naver_use_default_super
      POSTGRES_DB: idcool_database_v01
      POSTGRES_INITDB_ARGS: "-U postgres"
    volumes:
      - ./init-db.sql:/docker-entrypoint-initdb.d/01-init.sql
      - idcool_data:/var/lib/postgresql/data
    ports:
      # - "5432:5432" 나중에 서버 컴퓨터에서는 5432로 바꾸던가 
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  idcool_data:
    driver: local