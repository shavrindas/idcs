user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {

    log_format websocket_debug
        '$remote_addr "$request" '
        'upgrade="$http_upgrade" '
        'connection="$http_connection" '
        'status=$status';

    # 1. $connection_upgrade 변수 매핑 추가 (웹소켓 핵심 설정)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # 2. upstream은 하나만 유지 (중복 제거 완료)
    upstream fastapi_servers {
        server idcool-backend:8080;
    }

    upstream vite_servers {
        server idcool-frontend:5173;
    }

    server {
        listen 80 default_server;
        server_name 211.55.127.239 localhost 127.0.0.1 _;
        access_log /var/log/nginx/access.log websocket_debug;

        # WebSocket - set
        location ^~ /api/facilities/data/set/ {
            proxy_pass http://fastapi_servers;

            proxy_http_version 1.1;
	proxy_set_header Upgrade websocket;
	proxy_set_header Connection upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # WebSocket - get
        location ^~ /api/facilities/data/get/ {
            proxy_pass http://fastapi_servers;

            proxy_http_version 1.1;
	proxy_set_header Upgrade websocket;
	proxy_set_header Connection upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # 일반 API
        location ~ ^/(api|docs|redoc|openapi.json) {
            proxy_pass http://fastapi_servers;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Frontend
        location / {
            proxy_pass http://vite_servers;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}