<!-- src/module/ServiceWeb/webui/index.html 수정 내용 중 script 및 테이블 영역 -->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>IDCool v2 - Node Management & Monitor</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; padding: 24px; background: #0f172a; color: #f8fafc; }
    h1 { font-size: 22px; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
    .grid { display: grid; grid-template-columns: 360px 1fr; gap: 20px; }
    .card { background: #1e293b; border-radius: 8px; padding: 20px; border: 1px solid #334155; }
    .card h2 { font-size: 16px; margin-top: 0; margin-bottom: 16px; color: #38bdf8; }
    label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 4px; }
    input, select, button { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; margin-bottom: 12px; font-size: 13px; }
    button { background: #2563eb; border: none; cursor: pointer; font-weight: 600; margin-top: 4px; }
    button:hover { background: #1d4ed8; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 10px; text-align: left; border-bottom: 1px solid #334155; }
    th { color: #94a3b8; font-weight: 500; }
    .badge { padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; display: inline-block; }
    .badge.online { background: #059669; color: #ecfdf5; }
    .badge.offline { background: #475569; color: #f1f5f9; }
    .btn-action { padding: 4px 8px; width: auto; margin: 0 2px; font-size: 11px; display: inline-block; }
    .btn-edit { background: #0284c7; }
    .btn-rotate { background: #d97706; }
    .btn-del { background: #dc2626; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; }
    .modal { background: #1e293b; padding: 24px; border-radius: 8px; width: 440px; border: 1px solid #475569; }
    .key-box { background: #0f172a; padding: 12px; border-radius: 6px; border: 1px dashed #38bdf8; word-break: break-all; color: #38bdf8; font-family: monospace; margin: 12px 0; font-size: 13px; }
  </style>
</head>
<body>
  <h1>🌐 IDCool v2 ServiceWeb - M2M Node Controller</h1>

  <div class="grid">
    <div class="card">
      <h2>🔑 새 엣지 노드 발급</h2>
      <label>소속 시설 선택</label>
      <select id="facSelect">
        <option value="">시설 목록 불러오는 중...</option>
      </select>

      <label>노드 식별 코드 (Unique)</label>
      <input type="text" id="nodeCode" placeholder="예: NODE_FACILITY_D" />

      <label>노드 명칭</label>
      <input type="text" id="nodeName" placeholder="예: 제1시설 공조제어 노드" />

      <button onclick="createNode()">API Key 발급 및 노드 등록</button>
    </div>

    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
        <h2 style="margin: 0;">📡 등록된 시스템 노드 현황</h2>
        <button style="width: auto; margin: 0; padding: 6px 12px;" onclick="loadNodes()">새로고침</button>
      </div>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>소속 시설명</th>
            <th>노드 코드</th>
            <th>명칭</th>
            <th>상태</th>
            <th>최근 신호</th>
            <th>관리</th>
          </tr>
        </thead>
        <tbody id="nodeTableBody">
          <tr><td colspan="7" style="text-align: center; color: #64748b;">데이터를 불러오는 중...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="modal-overlay" id="keyModal">
    <div class="modal">
      <h3 style="margin-top: 0; color: #38bdf8;">⚠️ API Key 발급 완료</h3>
      <p style="font-size: 13px; color: #cbd5e1; line-height: 1.5;">
        발급된 원문 API Key는 보안상 <strong>지금 단 한 번만</strong> 표시됩니다. 창을 닫으면 다시 조회할 수 없으므로 엣지 노드의 <code>.env</code> 파일에 복사해 두세요.
      </p>
      <div class="key-box" id="modalApiKey"></div>
      <button onclick="closeModal()">복사 후 창 닫기</button>
    </div>
  </div>

  <script>
    let cachedFacilities = [];

    async function loadFacilities() {
      try {
        const res = await fetch('/api/v1/serviceweb/admin/nodes/facilities');
        const json = await res.json();
        cachedFacilities = json.data || [];
        const select = document.getElementById('facSelect');
        select.innerHTML = '';

        if (cachedFacilities.length === 0) {
          select.innerHTML = '<option value="">등록된 시설이 없습니다</option>';
          return;
        }

        cachedFacilities.forEach(fac => {
          const opt = document.createElement('option');
          opt.value = fac.id;
          opt.textContent = fac.name;
          select.appendChild(opt);
        });
      } catch (err) {
        console.error("시설 목록 로드 실패:", err);
      }
    }

    async function loadNodes() {
      try {
        const res = await fetch('/api/v1/serviceweb/admin/nodes');
        const json = await res.json();
        const tbody = document.getElementById('nodeTableBody');
        tbody.innerHTML = '';

        if (!json.data || json.data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; color: #64748b;">등록된 노드가 없습니다.</td></tr>';
          return;
        }

        json.data.forEach(node => {
          const tr = document.createElement('tr');
          const isOnline = node.status === 'ONLINE';
          tr.innerHTML = `
            <td>${node.id}</td>
            <td><strong>${node.facility_name || ('시설 #' + node.facility_id)}</strong></td>
            <td><strong>${node.node_code}</strong></td>
            <td>${node.node_name}</td>
            <td><span class="badge ${isOnline ? 'online' : 'offline'}">${node.status}</span></td>
            <td style="font-size: 12px; color: #94a3b8;">${node.last_heartbeat_at ? new Date(node.last_heartbeat_at).toLocaleTimeString() : '-'}</td>
            <td>
              <button class="btn-action btn-edit" onclick="editNode(${node.id}, '${node.node_name}')">수정</button>
              <button class="btn-action btn-rotate" onclick="rotateKey(${node.id})">재발급</button>
              <button class="btn-action btn-del" onclick="deleteNode(${node.id})">삭제</button>
            </td>
          `;
          tbody.appendChild(tr);
        });
      } catch (err) {
        console.error("노드 로드 실패:", err);
      }
    }

    async function editNode(nodeId, currentName) {
      const newName = prompt("변경할 노드 명칭을 입력하세요:", currentName);
      if (newName === null || newName.trim() === "" || newName === currentName) return;

      const res = await fetch(`/api/v1/serviceweb/admin/nodes/${nodeId}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ node_name: newName.trim() })
      });
      if (res.ok) {
        loadNodes();
      } else {
        alert("수정 실패");
      }
    }

    async function createNode() {
      const facility_id = parseInt(document.getElementById('facSelect').value);
      const node_code = document.getElementById('nodeCode').value.trim();
      const node_name = document.getElementById('nodeName').value.trim();

      if (!facility_id || !node_code || !node_name) {
        alert("모든 필드를 입력하세요.");
        return;
      }

      const res = await fetch('/api/v1/serviceweb/admin/nodes', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ facility_id, node_code, node_name })
      });

      const json = await res.json();
      if (res.ok) {
        showKey(json.api_key);
        document.getElementById('nodeCode').value = '';
        document.getElementById('nodeName').value = '';
        loadNodes();
      } else {
        alert(json.detail || "생성 실패");
      }
    }

    async function rotateKey(nodeId) {
      if (!confirm("키를 재발급하면 기존 키로 연결된 통신은 즉시 차단됩니다. 진행하시겠습니까?")) return;
      const res = await fetch(`/api/v1/serviceweb/admin/nodes/${nodeId}/rotate-key`, { method: 'POST' });
      const json = await res.json();
      if (res.ok) {
        showKey(json.new_api_key);
      } else {
        alert(json.detail || "재발급 실패");
      }
    }

    async function deleteNode(nodeId) {
      if (!confirm("정말 이 노드를 삭제하시겠습니까? 관련 통신과 인증이 영구 차단됩니다.")) return;
      const res = await fetch(`/api/v1/serviceweb/admin/nodes/${nodeId}`, { method: 'DELETE' });
      if (res.ok) {
        loadNodes();
      } else {
        alert("삭제 실패");
      }
    }

    function showKey(key) {
      document.getElementById('modalApiKey').innerText = key;
      document.getElementById('keyModal').style.display = 'flex';
    }

    function closeModal() {
      navigator.clipboard.writeText(document.getElementById('modalApiKey').innerText);
      document.getElementById('keyModal').style.display = 'none';
      alert("키가 클립보드에 복사되었습니다.");
    }

    loadFacilities();
    loadNodes();
    setInterval(loadNodes, 3000);
  </script>
</body>
</html>
